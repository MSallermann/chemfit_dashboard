[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemfit-dashboard"
version = "0.1.0"
description = "Native viewer for serialized ChemFit evaluation contexts"
readme = "README.md"
authors = [{ name = "Moritz Sallermann" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["chemfit", "data-analysis", "scientific-computing", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pydictnest>=0.3.0"]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "rapidfuzz>=3.10"]
test = ["chemfit>=4.0.0", "pytest>=8", "PySide6>=6.7", "rapidfuzz>=3.10"]
dev = [
    "build>=1.2",
    "chemfit>=4.0.0",
    "PySide6>=6.7",
    "pyright>=1.1.403",
    "pytest>=8",
    "rapidfuzz>=3.10",
    "ruff>=0.12",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/MSallermann/chemfit_dashboard"
Repository = "https://github.com/MSallermann/chemfit_dashboard"
Issues = "https://github.com/MSallermann/chemfit_dashboard/issues"
Changelog = "https://github.com/MSallermann/chemfit_dashboard/blob/main/CHANGELOG.md"

[project.scripts]
chemfit-dashboard = "chemfit_dashboard.cli:main"
chemfit-extract = "chemfit_dashboard.extraction_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chemfit_dashboard = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.pyright]
include = ["src/chemfit_dashboard"]
strict = []

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "BLE001",
    "C901",
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D202",
    "D203",
    "D212",
    "D401",
    "D417",
    "E501",
    "ERA001",
    "FBT001",
    "FBT002",
    "FIX002",
    "G004",
    "INP001",
    "N803",
    "N806",
    "N818",
    "PD901",
    "PGH003",
    "PLR0913",
    "PLR2004",
    "PT012",
    "S101",
    "T201",
    "TC001",
    "TC002",
    "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001"]
