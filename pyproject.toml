[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chemfit-dashboard"
version = "0.1.0"
description = "Native viewer for serialized ChemFit evaluation contexts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "pydictnest>=0.3.0"]

[project.optional-dependencies]
test = ["chemfit>=4.0.0", "pytest>=8"]

[project.scripts]
chemfit-dashboard = "chemfit_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.pyright]
include = ["src/chemfit_dashboard"]
strict = []

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "BLE001",
    "C901",
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D202",
    "D203",
    "D212",
    "D401",
    "D417",
    "E501",
    "ERA001",
    "FBT001",
    "FBT002",
    "FIX002",
    "G004",
    "INP001",
    "N803",
    "N806",
    "N818",
    "PD901",
    "PGH003",
    "PLR0913",
    "PLR2004",
    "PT012",
    "S101",
    "T201",
    "TC001",
    "TC002",
    "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001"]
